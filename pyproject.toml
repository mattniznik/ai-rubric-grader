[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rubric-grader"
version = "0.1.0"
description = "Draft rubric grades with Claude, held for a human to approve before anything is exported."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mat Niznik" }]
dependencies = ["anthropic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rubric-grader = "rubric_grader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
